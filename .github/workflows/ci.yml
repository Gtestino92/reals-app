name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
  push:
    branches:
      - main
      - master
      - development

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Kotlin compilation
        run: ./gradlew :app:compileLocalDebugKotlin --no-daemon --console=plain

      - name: Build local debug APK
        run: ./gradlew :app:assembleLocalDebug --no-daemon --console=plain

      - name: Upload local debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-local-debug-apk
          path: app/build/outputs/apk/local/debug/*.apk
          if-no-files-found: error

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    needs: android-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android builder image
        run: |
          docker build \
            --build-arg IMAGE_REPOSITORY="reals-app" \
            --build-arg IMAGE_TAG="ci" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            -t reals-app:ci \
            .

      - name: Extract APK from image
        run: |
          id="$(docker create reals-app:ci)"
          mkdir -p docker-artifacts
          docker cp "$id:/workspace/app/build/outputs/apk/local/debug/." docker-artifacts/
          docker rm "$id"
          ls -la docker-artifacts

      - name: Upload Docker-built APK
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-local-debug-apk-docker
          path: docker-artifacts/*.apk
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
