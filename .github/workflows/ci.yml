name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - development
  push:
    branches:
      - main
      - master
      - development

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode Firebase client configs when provided
        shell: bash
        env:
          GOOGLE_SERVICES_LOCAL_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_LOCAL_JSON_BASE64 }}
          GOOGLE_SERVICES_DEV_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_DEV_JSON_BASE64 }}
          GOOGLE_SERVICES_PROD_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_PROD_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_LOCAL_JSON_BASE64:-}" ]; then
            mkdir -p app/src/local
            printf '%s' "$GOOGLE_SERVICES_LOCAL_JSON_BASE64" | base64 --decode > app/src/local/google-services.json
          fi
          if [ -n "${GOOGLE_SERVICES_DEV_JSON_BASE64:-}" ]; then
            mkdir -p app/src/dev
            printf '%s' "$GOOGLE_SERVICES_DEV_JSON_BASE64" | base64 --decode > app/src/dev/google-services.json
          fi
          if [ -n "${GOOGLE_SERVICES_PROD_JSON_BASE64:-}" ]; then
            mkdir -p app/src/prod
            printf '%s' "$GOOGLE_SERVICES_PROD_JSON_BASE64" | base64 --decode > app/src/prod/google-services.json
          fi

      - name: Validate environment isolation
        run: ./gradlew :app:validateEnvironmentIsolation :app:verifyAppCheckDependencyIsolation --no-daemon --console=plain

      - name: Run local unit tests
        run: ./gradlew :app:testLocalDebugUnitTest --no-daemon --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-unit-test-reports
          path: app/build/reports/tests/testLocalDebugUnitTest
          if-no-files-found: ignore

      - name: Run Android lint
        run: ./gradlew :app:lintLocalDebug --no-daemon --console=plain

      - name: List lint reports
        if: always()
        shell: bash
        run: |
          if [ -d app/build/reports ]; then
            find app/build/reports -maxdepth 4 -type f | sort
          else
            echo "app/build/reports does not exist"
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-lint-reports
          path: |
            app/build/reports/lint-results-*
            app/build/reports/lint/**
          if-no-files-found: ignore

      - name: Validate Kotlin compilation
        run: ./gradlew :app:compileLocalDebugKotlin --no-daemon --console=plain

      - name: Build local debug APK
        run: ./gradlew :app:assembleLocalDebug --no-daemon --console=plain

      - name: Build dev debug APK when configured
        shell: bash
        env:
          REALS_DEV_BASE_URL: ${{ secrets.REALS_DEV_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -f app/src/dev/google-services.json ] && [ -n "${REALS_DEV_BASE_URL:-}" ]; then
            ./gradlew :app:compileDevDebugKotlin :app:assembleDevDebug --no-daemon --console=plain
          else
            echo "Skipping devDebug build: requires GOOGLE_SERVICES_DEV_JSON_BASE64 and REALS_DEV_BASE_URL secrets."
          fi

      - name: Build prod release APK when configured
        shell: bash
        env:
          REALS_PROD_BASE_URL: ${{ secrets.REALS_PROD_BASE_URL }}
          REALS_RELEASE_KEYSTORE_BASE64: ${{ secrets.REALS_RELEASE_KEYSTORE_BASE64 }}
          REALS_RELEASE_STORE_PASSWORD: ${{ secrets.REALS_RELEASE_STORE_PASSWORD }}
          REALS_RELEASE_KEY_ALIAS: ${{ secrets.REALS_RELEASE_KEY_ALIAS }}
          REALS_RELEASE_KEY_PASSWORD: ${{ secrets.REALS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f app/src/prod/google-services.json ] && [ -n "${REALS_PROD_BASE_URL:-}" ]; then
            ./gradlew :app:compileProdReleaseKotlin :app:assembleProdRelease --no-daemon --console=plain
          else
            echo "Skipping prodRelease build: requires GOOGLE_SERVICES_PROD_JSON_BASE64 and REALS_PROD_BASE_URL secrets."
          fi

      - name: Upload local debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-local-debug-apk
          path: app/build/outputs/apk/local/debug/*.apk
          if-no-files-found: error

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    needs: android-build
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android builder image
        run: |
          docker build \
            --build-arg IMAGE_REPOSITORY="reals-app" \
            --build-arg IMAGE_TAG="ci" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            -t reals-app:ci \
            .

      - name: Scan Android builder image for critical vulnerabilities
        id: trivy_dev
        if: github.ref_name != 'master' && github.ref_name != 'main' && github.base_ref != 'master' && github.base_ref != 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-app:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          output: trivy-results.txt

      - name: Scan Android builder image for high and critical vulnerabilities
        id: trivy_prod
        if: github.ref_name == 'master' || github.ref_name == 'main' || github.base_ref == 'master' || github.base_ref == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-app:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          output: trivy-results.txt

      - name: Publish Trivy summary
        if: always()
        shell: bash
        run: |
          if [ -f trivy-results.txt ]; then
            {
              echo "### Trivy Android builder image scan"
              echo
              echo '```text'
              cat trivy-results.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce Trivy policy
        if: steps.trivy_dev.outcome == 'failure' || steps.trivy_prod.outcome == 'failure'
        run: |
          echo "Trivy image scan failed. See the job summary for the vulnerability table."
          exit 1

      - name: Extract APK from image
        run: |
          id="$(docker create reals-app:ci)"
          mkdir -p docker-artifacts
          docker cp "$id:/workspace/app/build/outputs/apk/local/debug/." docker-artifacts/
          docker rm "$id"
          ls -la docker-artifacts

      - name: Upload Docker-built APK
        uses: actions/upload-artifact@v4
        with:
          name: reals-app-local-debug-apk-docker
          path: docker-artifacts/*.apk
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
